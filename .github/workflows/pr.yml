name: PR

permissions:
  pull-requests: write

on:
  pull_request:
    types: [opened, edited, ready_for_review, synchronize, converted_to_draft]
    paths:
      - "**.scala"
      - "**.sbt"
      - "project/**"
      - ".github/workflows/pr-draft.yml"
      - ".github/workflows/pr-ready.yml"

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      is_ephemeral: ${{ contains(github.event.pull_request.labels.*.name, 'ephemeral')  }}
      is_draft: ${{ github.event.pull_request.draft }}
    steps:
      - name: Init
        run: echo Init

  ephmeral:
    name: Ephemeral deployment
    needs: init
    if: ${{ needs.init.outputs.is_ephemeral == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ephemeral PR detected
        run: echo "Ephemeral PR - skipping all checks"

  build:
    name: PR Build
    needs: init
    if: ${{ needs.init.outputs.is_ephemeral != 'true' }}
    uses: ./.github/workflows/pr-build.yml
    with:
      is_draft: ${{ needs.init.outputs.is_draft == 'true' }}
