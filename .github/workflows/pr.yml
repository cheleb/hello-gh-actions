name: PR

permissions:
  pull-requests: write

on:
  pull_request:
    types: [opened, edited, ready_for_review, synchronize, converted_to_draft]

jobs:
  pr_draft:
    if: ${{ github.event.pull_request.draft }}
    uses: ./.github/workflows/pr-draft.yml
  pr_ready:
    if: ${{ github.event.pull_request.draft == false }}
    uses: ./.github/workflows/pr-ready.yml
  lint:
    uses: ./.github/workflows/pr-ready.yml
